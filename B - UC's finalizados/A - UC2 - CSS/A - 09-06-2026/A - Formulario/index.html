<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--* Index - nome padrão da primeira página de um site* -->
<!--* Serve para organizar grupos de tags em um "quadrado" para separarmos os conteúdos -->
    
<div class="campos">
        
        <!--* Formulário - Campos de preenchimento -->
        <h1>Login</h1>
        <form action="">
            
            <!--^ Label - Etiqueta -->
            <label for="usuario">Nome de Usuário</label>
            <!--^ Input - Entrada de dados "leia( )" -->
            <input type="text" name="usuario" id=usuario>
            
            <label for="senha">Senha</label>
            <!--* Password - Senha -->
            <input type= "password" name="senha" id="senha">

            <!--^ Submit - Botão de finalizar formulário e enviar as informações-->
            <input type="submit" value="Entrar">
        
        </form>
    
    </div>
    
</body>
</html>
