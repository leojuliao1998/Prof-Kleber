<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha de Heróis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="jogo">
        <div>
            <h1 class="titulo">Batalha de Heróis</h1>
        </div>

        <div class="placar">
            <h1 id="pontos-jogador">Pontos Jogador: 0</h1>
            <h1 id="pontos-cpu">Pontos Máquina: 0</h1>
        </div>

        <h1 class="escolha">Escolha sua Carta:</h1>
    
        <div class="botoes">
            <div class="botao" onclick="jogar('Guerreiro')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1bTfM5BFTfbyn1CnvYBWAOqzX0DZgRCbLAGCFpaZ2qA&s=10" alt="">
                <h2 class="digitado">Guerreiro</h2>
            </div>

            <div class="botao" onclick="jogar('Mago')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3VcpCGJ3ZY1Bt1LUPpX_NmL38mNd_9NFGctrr-pnXWA&s=10" alt="">
                <h2 class="digitado">Mago</h2>
            </div>

            <div class="botao" onclick="jogar('Arqueiro')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpJr0sdy34yBi_EZPBBJplyZo-JI4M0Xo1aL00QTQo0A&s=10" alt="">
                <h2 class="digitado">Arqueiro</h2>
            </div>

            <div class="botao" onclick="jogar('Ladino')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2HzogPMMytxBNt8K_5ZgyNeJJa7jn6l4izX4nbIjrTw&s=10" alt="">
                <h2 class="digitado">Ladino</h2>
            </div>

            <div class="botao" onclick="jogar('Paladino')">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGkuQDBVZOJ36vN1leJmFGBKdyHrlA9XBUUNeiq5GTGA&s=10" alt="">
                <h2 class="digitado">Paladino</h2>
        </div>
    </div>




    
    <script src="script/script.js"></script>
</body>
</html>
